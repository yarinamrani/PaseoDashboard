<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>פסאו · סידור הושבה חי</title>
<style>
  html,body{margin:0;height:100%;background:#faf7f0;font-family:'Heebo',system-ui,-apple-system,sans-serif}
  .boot{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#8a8578;gap:14px;text-align:center;padding:24px}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid #e6e0d2;border-top-color:#c90;animation:s .9s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="boot" id="boot"><div class="spin"></div><div>טוען את סידור ההושבה…</div></div>
<script>
  var SRC = "https://vzeowbriddhvhpishmhn.supabase.co/storage/v1/object/public/pages/seating.html";
  fetch(SRC, { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function (html) { document.open(); document.write(html); document.close(); })
    .catch(function (e) {
      document.getElementById("boot").innerHTML =
        "<div style='color:#b23'>שגיאה בטעינת הדף</div><div style='font-size:.8rem'>" + e + "</div>";
    });
</script>
</body>
</html>
