name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/monday-dashboard-mvp-KOjiH
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# מאפשר ריצה אחת בכל פעם, ומבטל ריצות ישנות שעדיין רצות
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # base path חייב להתאים בדיוק לשם הריפו (רגיש לאותיות): https://<user>.github.io/PaseoDashboard/
      - run: npx vite build --base=/PaseoDashboard/

      # SPA fallback: כל נתיב שלא נמצא יחזיר את index.html כדי שה-router יטפל בו
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
